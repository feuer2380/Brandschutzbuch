<title>Brandschutzbuch</title>
<style>
:root{--red:#b91c1c;--red2:#dc2626;--bg:#f4f4f5;--card:#ffffff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--ok:#15803d;--warn:#b45309;--okbg:#dcfce7;--warnbg:#fef3c7;--errbg:#fee2e2}
@media (prefers-color-scheme: dark){:root{--bg:#09090b;--card:#18181b;--tx:#fafafa;--mut:#a1a1aa;--bd:#2e2e33;--okbg:#14532d;--warnbg:#451a03;--errbg:#450a0a;--ok:#4ade80;--warn:#fbbf24;--red2:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:#0b0b0b;border-bottom:3px solid var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center}
header>*{margin-right:8px}header>*:last-child{margin-right:0}
.brand{display:flex;align-items:center;flex-shrink:0}.brand img{height:36px;width:auto;display:block;border-radius:3px}
.hero{border-radius:12px;overflow:hidden;margin-bottom:12px;background:#000}.hero img{width:100%;height:300px;object-fit:cover;object-position:center top;display:block}
.banner{border-radius:12px;overflow:hidden;margin-bottom:12px;height:130px;background:#000}.banner img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
#gebSel{flex:1;min-width:0;width:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 8px;font-size:15px}
#gebSel option{color:#000}
.icon{background:none;border:none;color:#fff;padding:6px;display:flex}
.icon svg{width:24px;height:24px}
main{padding:calc(env(safe-area-inset-top) + 74px) 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;padding:8px 2px 6px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;position:relative;font-family:inherit}
nav button.on{color:var(--red)}
nav svg{width:24px;height:24px;margin-bottom:2px}
.badge{position:absolute;top:3px;left:56%;background:var(--red2);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;min-width:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:21px;margin:4px 0 12px}
h3{font-size:13px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--mut)}
.stat.alert b{color:var(--red2)}
.row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row>*{margin-right:10px}.row>*:last-child{margin-right:0}
.row:last-child{border-bottom:none}
.row .m{flex:1;min-width:0}.row .t{font-weight:600;overflow-wrap:anywhere}.row .s{font-size:13px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;white-space:nowrap;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-err{background:var(--errbg);color:var(--red2)}.p-mut{background:var(--bd);color:var(--mut)}
.btn{background:var(--bd);color:var(--tx);border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;font-family:inherit}
.btn.pri{background:var(--red);color:#fff}.btn.danger{background:var(--red2);color:#fff}
.btn.full{width:100%;display:block;margin-top:8px}.btn.sm{padding:7px 11px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;margin-top:6px}.btns .btn{margin:4px 6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
input[type=date],input[type=time]{min-height:44px}
textarea{min-height:80px;resize:vertical}
.two{display:flex}.two>div{flex:1}.two>div:first-child{margin-right:10px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--tx);padding:10px 4px;font-size:14px;font-weight:600;border-right:1px solid var(--bd);font-family:inherit}
.seg button:last-child{border-right:none}
.seg button.on-ok{background:var(--ok);color:#fff}.seg button.on-err{background:var(--red2);color:#fff}.seg button.on-na{background:var(--mut);color:#fff}.seg button.on{background:var(--red);color:#fff}
.pt{padding:12px 0;border-bottom:1px solid var(--bd)}.pt .q{margin-bottom:8px;font-size:15px}
#modalWrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modalWrap.hidden{display:none}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px}
.mhead span{flex:1;margin-right:10px}
.mhead button{background:var(--bd);border:none;border-radius:50%;width:32px;height:32px;font-size:15px;color:var(--tx);flex-shrink:0}
#mBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 18px;flex:1}
#mFoot{display:flex;padding:10px 16px;border-top:1px solid var(--bd)}
#mFoot .btn{flex:1;margin-right:8px}#mFoot .btn:last-child{margin-right:0}
#mFoot.empty{display:none}
.sig{width:100%;height:150px;background:#fff;border:1px dashed var(--mut);border-radius:10px;touch-action:none;display:block}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0}
.foto{width:100%;border-radius:10px;margin-top:8px;display:block}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--red);color:#fff;border:none;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:80;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.kv{width:100%;border-collapse:collapse;font-size:14px}.kv td{padding:7px 0;border-bottom:1px solid var(--bd);vertical-align:top}.kv td:first-child{color:var(--mut);width:42%;padding-right:8px}
.chk{display:flex;align-items:center;padding:9px 0;font-size:15px;margin:0;color:var(--tx);font-weight:400}
.chk input{width:22px;height:22px;margin:0 12px 0 0;flex-shrink:0}
.small{font-size:13px;color:var(--mut)}
.grp{font-size:12px;font-weight:700;color:var(--red);margin:16px 0 0;text-transform:uppercase;letter-spacing:.04em}
.hint{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lnk{color:var(--red);font-weight:600}
@media (min-width:900px){
  header{padding-left:calc(50% - 400px);padding-right:calc(50% - 400px)}
  #gebSel{max-width:460px;margin-left:auto}
  main{max-width:800px;padding-bottom:110px}
  nav{left:calc(50% - 400px);right:calc(50% - 400px);border-left:1px solid var(--bd);border-right:1px solid var(--bd);border-radius:14px 14px 0 0}
  nav button{font-size:13px}
  .fab{right:calc(50% - 390px)}
  #modalWrap{align-items:center}
  .modal{max-width:820px;max-height:90%;border-radius:16px}
  .stats{grid-template-columns:repeat(4,1fr)}
  .row:hover,.stat:hover{cursor:pointer}
  .btn:hover{filter:brightness(.95);cursor:pointer}
}
</style>
</head>

function saveGebaeude(id) {

  if (!g) { g = { id: uid(), erstellt: todayStr() }; DB.gebaeude.push(g); }
  g.name = name; g.adresse = val('g_adr'); g.verantwortlich = val('g_ver'); g.bsb = val('g_bsb'); g.telefon = val('g_tel'); g.firma = val('g_fa'); g.notiz = val('g_not'); g.foto = GFOTO; g.beschreibung = val('g_pb'); g.startDatum = val('g_ab') || g.erstellt;

function delGebaeude(id) {
  var g = findById(DB.gebaeude, id); if (!g) return;
  ask('Gebäude "' + g.name + '" mit allen Anlagen, Begehungen und Mängeln endgültig löschen?', function () {
    var cs = ['anlagen', 'pruefungen', 'begehungen', 'maengel', 'berichte'];
    for (var c = 0; c < cs.length; c++) { var a = DB[cs[c]]; for (var i = a.length - 1; i >= 0; i--) if (a[i].gid === id) a.splice(i, 1); save(cs[c]); }

    STATE.gid = DB.gebaeude.length ? DB.gebaeude[0].id : null;
    render(); toast('Gebäude gelöscht');

/* ---------- Prüffristen (früher Anlagen) ---------- */
function viewAnlagen() {
  var all = byG(DB.anlagen);
  var h = '<h2>Prüffristen</h2><p class="small" style="margin:-6px 0 12px;line-height:1.45">Wann ist welche Anlage zu prüfen? Tragen Sie je Anlage das Intervall und die letzte Prüfung ein - die App berechnet die nächste Fälligkeit und zeigt rechtzeitig an, was fällig wird.</p>';
  if (!all.length) {
    h += '<div class="card" style="text-align:center"><p style="line-height:1.5;margin-top:4px">Noch keine Prüffristen eingetragen.</p><button class="btn pri full" onclick="pfAuswahl()">Prüffristen auswählen</button><p class="small">z. B. Feuerlöscher, Brandmeldeanlage, Brandschutztüren ...</p></div>';
    return h;
  }
  h += '<div id="anlList">' + anlListHtml() + '</div><button class="fab" onclick="pfAuswahl()">+ Prüffrist</button>';
  return h;
}
function anlListHtml() {
  var l = byG(DB.anlagen); sortAnlagen(l);
  var h = '<div class="card" style="padding-top:4px;padding-bottom:4px">';
  for (var j = 0; j < l.length; j++) {
    var b = l[j];
    h += '<div class="row" onclick="showAnlage(\'' + b.id + '\')"><div class="m"><div class="t">' + esc(anlName(b)) + '</div><div class="s">' +
      (b.intervall ? 'Alle ' + intvText(b.intervall) : 'Kein Intervall') + ', zuletzt geprüft: ' + (fmtD(b.letztePruefung) || 'nicht eingetragen') + (b.standort ? ', ' + esc(b.standort) : '') + '</div></div>' + anlStatus(b) + '</div>';
  }
  return h + '</div>';
}
function intvText(m) { m = +m; if (!m) return '-'; if (m % 12 === 0) return (m / 12) + (m === 12 ? ' Jahr' : ' Jahre'); return m + (m === 1 ? ' Monat' : ' Monate'); }
function sortAnlagen(l) {
  l.sort(function (a, b) {
    var x = a.naechstePruefung || '9999', y = b.naechstePruefung || '9999';
    if (x !== y) return x < y ? -1 : 1;
    return katIdx(a.kategorie) - katIdx(b.kategorie);
  });
}
function pfAuswahl() {
  var vorh = {}, l = byG(DB.anlagen);
  for (var i = 0; i < l.length; i++) vorh[l[i].kategorie] = true;
  var h = '<p class="small" style="line-height:1.45">Anhaken, was es im Gebäude gibt. Intervall in Monaten bei Bedarf anpassen (Vorschlagswerte - bitte nach Bescheid/Norm prüfen).</p>';
  for (var k = 0; k < KATS.length; k++) {
    if (vorh[KATS[k].k]) continue;
    h += '<div class="row" style="padding:7px 0"><label class="chk" style="flex:1;margin:0;padding:0"><input type="checkbox" class="pfchk" data-i="' + k + '">' + esc(KATS[k].k) + '</label>' +
      '<input id="pfi' + k + '" type="text" inputmode="numeric" value="' + KATS[k].i + '" style="width:64px;text-align:center;padding:8px"><span class="small" style="width:46px">Mon.</span></div>';
  }
  h += '<label>Eigene Prüffrist (optional)</label><div class="two"><div><input id="pf_eig" placeholder="Bezeichnung"></div><div><input id="pf_eigi" type="text" inputmode="numeric" placeholder="Monate"></div></div>';
  modal('Prüffristen auswählen', h, [{ label: 'Abbrechen', fn: closeModal }, { label: 'Übernehmen', cls: 'pri', fn: pfUebernehmen }]);
}
function pfUebernehmen() {
  var c = document.querySelectorAll('.pfchk'), n = 0;
  for (var i = 0; i < c.length; i++) {
    if (!c[i].checked) continue;
    var k = +c[i].getAttribute('data-i');
    DB.anlagen.push({ id: uid(), gid: STATE.gid, erstellt: todayStr(), kategorie: KATS[k].k, intervall: parseInt(val('pfi' + k), 10) || KATS[k].i, letztePruefung: '', naechstePruefung: '', firma: '', notiz: '' });
    n++;
  }
  var eig = val('pf_eig');
  if (eig) { DB.anlagen.push({ id: uid(), gid: STATE.gid, erstellt: todayStr(), kategorie: eig, intervall: parseInt(val('pf_eigi'), 10) || 12, letztePruefung: '', naechstePruefung: '', firma: '', notiz: '' }); n++; }
  if (!n) { toast('Bitte mindestens eine Prüffrist anhaken'); return; }
  save('anlagen'); closeModal(); render();
  info('Prüffristen angelegt', '<p style="line-height:1.5">' + n + ' Prüffrist(en) angelegt. Tippen Sie jetzt auf eine Zeile und tragen Sie das Datum der letzten Prüfung ein - die nächste Fälligkeit wird automatisch berechnet.</p>');
}

function pfCalc() { var lp = val('f_lp'), iv = parseInt(val('f_int'), 10); if (lp && iv) $('f_np').value = addMonths(lp, iv); }
function saveAnlage(id) {
  var a = id ? findById(DB.anlagen, id) : null, neu = !a;

function savePruefung(aid, pid) {

    '<label>Logo</label><div id="bk_lprev">' + (B.logo ? '<img src="' + B.logo + '" style="width:90px;height:90px;object-fit:contain;display:block">' : '<span class="small">kein Logo</span>') + '</div>' +
    '<div class="btns"><label class="btn sm" style="margin:4px 6px 0 0;color:var(--tx);font-weight:600">Logo wählen<input type="file" accept="image/*" style="display:none" onchange="pickFotoCrop(this,1,600,function(d){LOGOTMP=d;$(\'bk_lprev\').innerHTML=\'<img src=\'+d+\' style=width:90px;height:90px;display:block>\';})"></label>' +
    '<button class="btn sm" onclick="LOGOTMP=LOGO_DEFAULT;$(\'bk_lprev\').innerHTML=\'<img src=\'+LOGO_DEFAULT+\' style=width:90px;height:90px;display:block>\'">Standard-Logo</button><button class="btn sm" onclick="LOGOTMP=\'\';$(\'bk_lprev\').innerHTML=\'<span class=small>kein Logo</span>\'">Ohne Logo</button></div>' +
    '<button class="btn full" onclick="saveBk()">Briefkopf speichern</button>';
  h += '<div class="grp">Gebäude</div>';
  for (var i = 0; i < DB.gebaeude.length; i++) h += '<div class="row" onclick="editGebaeude(\'' + DB.gebaeude[i].id + '\')"><div class="m"><div class="t">' + esc(DB.gebaeude[i].name) + '</div><div class="s">' + esc(DB.gebaeude[i].adresse || '') + '</div></div><span class="small">Bearbeiten</span></div>';
  h += '<button class="btn full" onclick="editGebaeude()">+ Gebäude anlegen</button>';
  h += '<div class="grp">Checklisten für Begehungen</div>';
  for (var j = 0; j < DB.vorlagen.length; j++) h += '<div class="row" onclick="editVorlage(\'' + DB.vorlagen[j].id + '\')"><div class="m"><div class="t">' + esc(DB.vorlagen[j].name) + '</div><div class="s">' + artLabel(DB.vorlagen[j].art) + ' - ' + nFragen(DB.vorlagen[j]) + ' Fragen</div></div><span class="small">Bearbeiten</span></div>';
  h += '<div class="btns"><button class="btn sm" onclick="editVorlage()">+ Neue Checkliste</button><button class="btn sm" onclick="buchVorlagen()">Auf Buch-Standard zurücksetzen</button></div>';
  h += '<div class="grp">Datensicherung</div><p class="small" style="line-height:1.5">Alle Daten sind nur auf diesem Gerät gespeichert. Sichern Sie regelmäßig - z. B. in iCloud Drive oder per Mail. Letzte Sicherung: ' + (s.letztesBackup ? fmtD(s.letztesBackup) : 'noch keine') + '</p>' +
    '<button class="btn pri full" onclick="exportBackup()">Daten sichern (Datei)</button>' +
    '<label>Sicherung wiederherstellen</label><input type="file" accept=".json,application/json" onchange="importBackup(this)">';
  h += '<div class="grp">Info</div><p class="small" style="line-height:1.5">Brandschutzbuch ' + esc(verText()) + ' <span class="lnk" onclick="checkUpdate(true)">auf Update prüfen</span><br>' + esc(FIRMA_KONTAKT) + '</p>';
  modal('Einstellungen', h, [{ label: 'Schließen', fn: function () { closeModal(); render(); } }]);
}
function saveBk() {
  var s = DB.settings;
  s.bk1 = val('bk1'); s.bk2 = val('bk2'); s.bk3 = val('bk3'); s.bk4 = val('bk4'); s.bkFuss = val('bkf');
  s.bkLogo = LOGOTMP === LOGO_DEFAULT ? undefined : LOGOTMP;
  if (s.bkLogo === undefined) delete s.bkLogo;
  save('settings'); toast('Briefkopf gespeichert');
}
function activateLic() {
  var n = val('s_ln'), c = val('s_lc').toUpperCase().replace(/\s/g, '');
  if (!n || !c) { toast('Bitte Name und Code eingeben'); return; }
  if (lizCode(n) !== c) { toast('Lizenzcode passt nicht zum Namen'); return; }
  DB.settings.lizenzName = n; DB.settings.lizenzCode = c; save('settings');
  toast('Vollversion freigeschaltet'); openSettings(); render();
}
function editVorlage(id) {
  var v = id ? findById(DB.vorlagen, id) : null, p = v || { art: 'monatlich', punkte: [] }, o = '';
  for (var i = 0; i < ARTEN.length; i++) o += '<option value="' + ARTEN[i].k + '"' + (ARTEN[i].k === p.art ? ' selected' : '') + '>' + ARTEN[i].l + '</option>';
  var h = '<label>Name der Checkliste</label><input id="v_n" value="' + esc(p.name) + '" placeholder="z. B. Wöchentliche Kontrolle Küche">' +
    '<label>Intervall</label><select id="v_a">' + o + '</select>' +
    '<label>Fragen (je Zeile eine Frage)</label><textarea id="v_p" style="min-height:300px">' + esc(p.punkte.join('\n')) + '</textarea>' +
    '<div class="small" style="margin-top:4px;line-height:1.45">Zeilen mit <b>#</b> am Anfang sind Überschriften, z. B. <i># Pos. 1 – Feuerwehrzufahrt</i>. Fragen so formulieren, dass <b>Ja = in Ordnung</b> bedeutet.</div>' +
    '<div class="small" style="margin-top:4px">Änderungen gelten für künftige Begehungen. Bestehende Protokolle bleiben unverändert.</div>';
  if (v) h += '<button class="btn full" style="margin-top:18px" onclick="vorlagePdf(\'' + v.id + '\')">Leere Vorlage drucken (PDF)</button><button class="btn full" style="color:var(--red2)" onclick="delVorlage(\'' + v.id + '\')">Checkliste löschen</button>';
  modal(v ? 'Checkliste bearbeiten' : 'Neue Checkliste', h, [{ label: 'Zurück', fn: openSettings }, { label: 'Speichern', cls: 'pri', fn: function () {
    var n = val('v_n'), lines = val('v_p').split(/\n/), pts = [];
    for (var k = 0; k < lines.length; k++) { var t = lines[k].replace(/^\s+|\s+$/g, ''); if (t) pts.push(t); }
    if (!n) { toast('Bitte einen Namen angeben'); return; }
    if (!nFragen({ punkte: pts })) { toast('Bitte mindestens eine Frage angeben'); return; }
    if (!v) { v = { id: uid() }; DB.vorlagen.push(v); }
    v.name = n; v.art = val('v_a'); v.punkte = pts; v.geaendert = true; save('vorlagen'); toast('Checkliste gespeichert'); openSettings();
  } }]);
}
function delVorlage(id) {
  if (DB.vorlagen.length <= 1) { toast('Mindestens eine Checkliste muss bleiben'); return; }
  ask('Checkliste löschen? Bestehende Protokolle bleiben erhalten.', function () { removeById(DB.vorlagen, id); save('vorlagen'); openSettings(); }, 'Löschen');
}
function buchVorlagen() {
  ask('Tägliche, monatliche, vierteljährliche und jährliche Checkliste auf den Stand des Brandschutzbuchs zurücksetzen? Eigene Änderungen daran gehen verloren, eigene zusätzliche Checklisten und alle Protokolle bleiben erhalten.', function () {
    var std = defVorlagen(), names = {};
    for (var i = 0; i < std.length; i++) names[std[i].name] = std[i];
    for (var j = DB.vorlagen.length - 1; j >= 0; j--) {
      var v = DB.vorlagen[j];
      if (v.name === 'Jährliche Überprüfung' || v.name === 'Jährliche Unterlagen und Prüfbefunde') { DB.vorlagen.splice(j, 1); continue; }
      if (names[v.name]) { v.punkte = names[v.name].punkte; v.art = names[v.name].art; v.geaendert = false; names[v.name] = null; }
    }
    for (var k = 0; k < std.length; k++) if (names[std[k].name]) DB.vorlagen.push(std[k]);
    save('vorlagen'); toast('Checklisten zurückgesetzt'); openSettings();
  }, 'Zurücksetzen');
}
function resetVorlagen() {
  var d = defVorlagen(), add = 0;
  for (var i = 0; i < d.length; i++) {
    var ex = false;
    for (var j = 0; j < DB.vorlagen.length; j++) if (DB.vorlagen[j].name === d[i].name) ex = true;
    if (!ex) { DB.vorlagen.push(d[i]); add++; }
  }
  save('vorlagen'); toast(add ? add + ' Standard-Checkliste(n) hinzugefügt' : 'Alle Standard-Checklisten sind bereits vorhanden'); openSettings();
}
function exportBackup() {
  var data = { app: 'brandschutzbuch', version: 1, exportiert: new Date().toISOString(), db: DB };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  DB.settings.letztesBackup = todayStr(); save('settings');
  shareBlob(blob, 'Brandschutzbuch-Sicherung_' + todayStr() + '.json', 'application/json');
  render();
}
function importBackup(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var data;
    try { data = JSON.parse(rd.result); } catch (e) { toast('Datei ist keine gültige Sicherung'); return; }
    if (!data || data.app !== 'brandschutzbuch' || !data.db) { toast('Datei ist keine Brandschutzbuch-Sicherung'); return; }
    ask('Alle aktuellen Daten durch die Sicherung vom ' + String(data.exportiert || '').substr(0, 10) + ' ersetzen?', function () {
      for (var i = 0; i < COLLS.length; i++) { var c = COLLS[i]; DB[c] = data.db[c] || (c === 'settings' ? {} : []); save(c); }
      STATE.gid = DB.gebaeude.length ? DB.gebaeude[0].id : null;
      render(); toast('Sicherung wiederhergestellt');
    }, 'Ersetzen');
  };
  rd.readAsText(f);
}

/* ---------- Start ---------- */
function init() {
  try { $('hdrLogo').src = IMG_HDR; } catch (e) {}
  dbOpen(function () {
    for (var i = 0; i < COLLS.length; i++) {
      var c = COLLS[i];
      if (c === 'settings') { if (!DB.settings || typeof DB.settings !== 'object' || DB.settings.length !== undefined) DB.settings = {}; }
      else if (!DB[c] || DB[c].length === undefined) DB[c] = [];
    }
    var mig = false;
    for (var mi = 0; mi < DB.maengel.length; mi++) {
      var MM = DB.maengel[mi];
      if (!MM.fotos) { MM.fotos = []; if (MM.foto) MM.fotos.push(MM.foto); if (MM.fotoBehoben) MM.fotos.push(MM.fotoBehoben); delete MM.foto; delete MM.fotoBehoben; mig = true; }
    }
    if (mig) save('maengel');
    if (!DB.vorlagen.length) { DB.vorlagen = defVorlagen(); DB.settings.vorlagenVer = VORLAGEN_VER; save('vorlagen'); save('settings'); }
    if ((DB.settings.vorlagenVer || 1) < VORLAGEN_VER) {
      var std = [defVorlagen()[0], monatsBegehung(), quartalBegehung(), jahresBegehung()];
      for (var ov = DB.vorlagen.length - 1; ov >= 0; ov--) if (DB.vorlagen[ov].name === 'Jährliche Überprüfung' || DB.vorlagen[ov].name === 'Jährliche Unterlagen und Prüfbefunde') DB.vorlagen.splice(ov, 1);
      for (var sv = 0; sv < std.length; sv++) {
        var ex = null;
        for (var vv = 0; vv < DB.vorlagen.length; vv++) if (DB.vorlagen[vv].name === std[sv].name) ex = DB.vorlagen[vv];
        if (!ex) DB.vorlagen.push(std[sv]); else if (!ex.geaendert) ex.punkte = std[sv].punkte;
      }
      DB.settings.vorlagenVer = VORLAGEN_VER; save('vorlagen'); save('settings');
    }
    /* leere Berichte von früheren Tagen aufräumen (entstehen durch "Neuer Bericht" ohne Einträge) */
    var leerB = 0;
    for (var lb = DB.berichte.length - 1; lb >= 0; lb--) if (!(DB.berichte[lb].eintraege || []).length && (DB.berichte[lb].datum || '') < todayStr()) { DB.berichte.splice(lb, 1); leerB++; }
    if (leerB) save('berichte');
    var g = null; try { g = localStorage.getItem('bsb_gid'); } catch (e) {}
    STATE.gid = (g && findById(DB.gebaeude, g)) ? g : (DB.gebaeude.length ? DB.gebaeude[0].id : null);
    if (DB.settings.appVersion !== APP_VERSION + '|' + APP_STAND) {
      var warAlt = DB.settings.appVersion;
      DB.settings.appVersion = APP_VERSION + '|' + APP_STAND; save('settings');
      if (warAlt || DB.gebaeude.length) setTimeout(function () { info('Update installiert', '<p style="line-height:1.5">Das Brandschutzbuch wurde aktualisiert auf <b>' + esc(verText()) + '</b>.</p><p class="small">Vorher: Version ' + esc((warAlt || 'älter').split('|')[0]) + ((warAlt || '').split('|')[1] ? ' vom ' + esc(warAlt.split('|')[1]) : '') + '</p>'); }, 400);
    }
    render();
    setTimeout(function () { checkUpdate(false); }, 1500);
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js')['catch'](function () {}); } catch (e) {}
  }
}
init();
</script>
</body>
</html>
