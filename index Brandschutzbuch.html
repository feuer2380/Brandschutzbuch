<style>
:root{--red:#b91c1c;--red2:#dc2626;--bg:#f4f4f5;--card:#ffffff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--ok:#15803d;--warn:#b45309;--okbg:#dcfce7;--warnbg:#fef3c7;--errbg:#fee2e2}
@media (prefers-color-scheme: dark){:root{--bg:#09090b;--card:#18181b;--tx:#fafafa;--mut:#a1a1aa;--bd:#2e2e33;--okbg:#14532d;--warnbg:#451a03;--errbg:#450a0a;--ok:#4ade80;--warn:#fbbf24;--red2:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center}
header>*{margin-right:8px}header>*:last-child{margin-right:0}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
#gebSel{flex:1;min-width:0;width:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 8px;font-size:15px}
#gebSel option{color:#000}
.icon{background:none;border:none;color:#fff;padding:6px;display:flex}
.icon svg{width:24px;height:24px}
main{padding:calc(env(safe-area-inset-top) + 66px) 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;padding:8px 2px 6px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;position:relative;font-family:inherit}
nav button.on{color:var(--red)}
nav svg{width:24px;height:24px;margin-bottom:2px}
.badge{position:absolute;top:3px;left:56%;background:var(--red2);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;min-width:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:21px;margin:4px 0 12px}
h3{font-size:13px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--mut)}
.stat.alert b{color:var(--red2)}
.row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row>*{margin-right:10px}.row>*:last-child{margin-right:0}
.row:last-child{border-bottom:none}
.row .m{flex:1;min-width:0}.row .t{font-weight:600;overflow-wrap:anywhere}.row .s{font-size:13px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;white-space:nowrap;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-err{background:var(--errbg);color:var(--red2)}.p-mut{background:var(--bd);color:var(--mut)}
.btn{background:var(--bd);color:var(--tx);border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;font-family:inherit}
.btn.pri{background:var(--red);color:#fff}.btn.danger{background:var(--red2);color:#fff}
.btn.full{width:100%;display:block;margin-top:8px}.btn.sm{padding:7px 11px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;margin-top:6px}.btns .btn{margin:4px 6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
input[type=date],input[type=time]{min-height:44px}
textarea{min-height:80px;resize:vertical}
.two{display:flex}.two>div{flex:1}.two>div:first-child{margin-right:10px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--tx);padding:10px 4px;font-size:14px;font-weight:600;border-right:1px solid var(--bd);font-family:inherit}
.seg button:last-child{border-right:none}
.seg button.on-ok{background:var(--ok);color:#fff}.seg button.on-err{background:var(--red2);color:#fff}.seg button.on-na{background:var(--mut);color:#fff}.seg button.on{background:var(--red);color:#fff}

#modalWrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modalWrap.hidden{display:none}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px}
.mhead span{flex:1;margin-right:10px}
.mhead button{background:var(--bd);border:none;border-radius:50%;width:32px;height:32px;font-size:15px;color:var(--tx);flex-shrink:0}
#mBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 18px;flex:1}
#mFoot{display:flex;padding:10px 16px;border-top:1px solid var(--bd)}
#mFoot .btn{flex:1;margin-right:8px}#mFoot .btn:last-child{margin-right:0}
#mFoot.empty{display:none}
.sig{width:100%;height:150px;background:#fff;border:1px dashed var(--mut);border-radius:10px;touch-action:none;display:block}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0}
.foto{width:100%;border-radius:10px;margin-top:8px;display:block}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--red);color:#fff;border:none;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:80;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.kv{width:100%;border-collapse:collapse;font-size:14px}.kv td{padding:7px 0;border-bottom:1px solid var(--bd);vertical-align:top}.kv td:first-child{color:var(--mut);width:42%;padding-right:8px}
.chk{display:flex;align-items:center;padding:9px 0;font-size:15px;margin:0;color:var(--tx);font-weight:400}
.chk input{width:22px;height:22px;margin:0 12px 0 0;flex-shrink:0}
.small{font-size:13px;color:var(--mut)}
.grp{font-size:12px;font-weight:700;color:var(--red);margin:16px 0 0;text-transform:uppercase;letter-spacing:.04em}
.hint{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lnk{color:var(--red);font-weight:600}
</style>

<script>
/* Brandschutzbuch - lokale Web-App (Janiba Brandschutztechnik GmbH) */
var APP_VERSION = '1.0';
var LIZ_SALT = 'JaNiBa-2380-BSB';
var FIRMA_FOOTER = 'Brandschutzbuch-App | Janiba Brandschutztechnik GmbH | Tel. 0676/305 83 98 | www.brandschutztechnik-janiba.at';

var idb = null;
var STATE = { tab: 'home', gid: null, anlQ: '', mFilter: 'offen' };

];

];
var PRIOS = [{ k: 'hoch', l: 'Hoch', c: '#dc2626' }, { k: 'mittel', l: 'Mittel', c: '#f59e0b' }, { k: 'gering', l: 'Gering', c: '#16a34a' }];

function defVorlagen() {

    { id: uid(), name: 'Tägliche Kontrolle', art: 'taeglich', punkte: [

    ] }
  ];
}

/* ---------- Hilfsfunktionen ---------- */
function $(id) { return document.getElementById(id); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 6); }
function esc(s) { if (s === undefined || s === null) return ''; return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function val(id) { var e = $(id); return e ? String(e.value).replace(/^\s+|\s+$/g, '') : ''; }
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function todayStr() { return ymd(new Date()); }
function nowTime() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function parseD(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmtD(s) { if (!s) return ''; var p = String(s).split('-'); if (p.length < 3) return s; return p[2] + '.' + p[1] + '.' + p[0]; }
function daysUntil(s) { if (!s) return null; return Math.round((parseD(s) - parseD(todayStr())) / 86400000); }
function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); }
function addMonths(s, m) { var d = parseD(s); var day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(day > last ? last : day); return ymd(d); }
function findById(arr, id) { for (var i = 0; i < arr.length; i++) { if (arr[i].id === id) return arr[i]; } return null; }
function removeById(arr, id) { for (var i = arr.length - 1; i >= 0; i--) { if (arr[i].id === id) arr.splice(i, 1); } }
function byG(arr) { var r = []; for (var i = 0; i < arr.length; i++) { if (arr[i].gid === STATE.gid) r.push(arr[i]); } return r; }
function curGeb() { return STATE.gid ? findById(DB.gebaeude, STATE.gid) : null; }
function artObj(k) { for (var i = 0; i < ARTEN.length; i++) { if (ARTEN[i].k === k) return ARTEN[i]; } return ARTEN[ARTEN.length - 1]; }
function artLabel(k) { return artObj(k).l; }
function katIdx(k) { for (var i = 0; i < KATS.length; i++) { if (KATS[i].k === k) return i; } return 99; }
function katInt(k) { var i = katIdx(k); return i < 99 ? KATS[i].i : 12; }
function prioObj(k) { for (var i = 0; i < PRIOS.length; i++) { if (PRIOS[i].k === k) return PRIOS[i]; } return PRIOS[1]; }
function pill(cls, t) { return '<span class="pill ' + cls + '">' + t + '</span>'; }
function safeName(s) { return String(s || 'Objekt').replace(/[^A-Za-z0-9\-_]+/g, '_').substr(0, 40); }
var toastT = null;
function toast(t) { var e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toastT); toastT = setTimeout(function () { e.className = ''; }, 2800); }

/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
function loadLS() {
  for (var i = 0; i < COLLS.length; i++) {
    try { var v = localStorage.getItem('bsb_' + COLLS[i]); if (v) DB[COLLS[i]] = JSON.parse(v); } catch (e) {}
  }
}
function dbOpen(cb) {
  var done = false;
  function fin() { if (done) return; done = true; cb(); }
  if (!window.indexedDB) { loadLS(); fin(); return; }
  var req;
  try { req = indexedDB.open('brandschutzbuch', 1); } catch (e) { loadLS(); fin(); return; }
  req.onupgradeneeded = function (e) { var db = e.target.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' }); };
  req.onsuccess = function (e) {
    idb = e.target.result;
    try {
      var tx = idb.transaction('kv', 'readonly');
      var r = tx.objectStore('kv').openCursor();
      r.onsuccess = function (ev) { var c = ev.target.result; if (c) { DB[c.value.k] = c.value.v; c['continue'](); } else { fin(); } };
      r.onerror = function () { fin(); };
    } catch (er) { fin(); }
  };
  req.onerror = function () { idb = null; loadLS(); fin(); };
}
function save(coll) {
  if (idb) {
    try {
      var tx = idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ k: coll, v: DB[coll] });
      tx.onerror = function () { toast('Speichern fehlgeschlagen - Speicher voll?'); };
      return;
    } catch (e) {}
  }
  try { localStorage.setItem('bsb_' + coll, JSON.stringify(DB[coll])); } catch (e2) { toast('Speicher voll - bitte Fotos reduzieren'); }
}

/* ---------- Lizenz ---------- */
function normName(s) { return String(s || '').toUpperCase().replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
function fnv(s) { var h = 0x811c9dc5; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0; } return h >>> 0; }
function lizCode(name) { var h = fnv(normName(name) + '|' + LIZ_SALT); var x = ('00000000' + h.toString(16).toUpperCase()).slice(-8); return 'BSB-' + x.substr(0, 4) + '-' + x.substr(4, 4); }
function isLicensed() { var s = DB.settings || {}; if (!s.lizenzName || !s.lizenzCode) return false; return lizCode(s.lizenzName) === String(s.lizenzCode).toUpperCase().replace(/\s/g, ''); }

/* ---------- Modal ---------- */
var MODAL_GUARD = null;
function modal(title, body, buttons, guard) {
  $('mTitle').textContent = title;
  $('mBody').innerHTML = body;
  var f = $('mFoot'); f.innerHTML = '';
  buttons = buttons || [];
  for (var i = 0; i < buttons.length; i++) {
    (function (b) { var el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.label; el.onclick = function () { b.fn(); }; f.appendChild(el); })(buttons[i]);
  }
  f.className = buttons.length ? '' : 'empty';
  MODAL_GUARD = guard || null;
  $('modalWrap').className = '';
  $('mBody').scrollTop = 0;
}
function closeModal() { $('modalWrap').className = 'hidden'; MODAL_GUARD = null; BEG = null; SIG = null; }
function closeModalAsk() { if (MODAL_GUARD) { var g = MODAL_GUARD; MODAL_GUARD = null; ask(g, function () { closeModal(); }); return; } closeModal(); }
function ask(text, fn, okLabel) {
  modal('Bitte bestätigen', '<p style="margin:14px 0">' + esc(text) + '</p>', [
    { label: 'Abbrechen', fn: closeModal },
    { label: okLabel || 'OK', cls: 'danger', fn: function () { closeModal(); fn(); } }
  ]);
}
function info(title, html) { modal(title, html, [{ label: 'OK', cls: 'pri', fn: closeModal }]); }

/* ---------- Navigation ---------- */
var ICONS = {

function initSig(c) {
  var ctx, drawing = false, empty = true, last = null;
  var r0 = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r0.width * dpr); c.height = Math.round(r0.height * dpr);
  ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111111'; ctx.fillStyle = '#111111';
  function pos(e) { var r = c.getBoundingClientRect(); var t = e.touches && e.touches.length ? e.touches[0] : e; return { x: t.clientX - r.left, y: t.clientY - r.top }; }
  function start(e) { e.preventDefault(); drawing = true; last = pos(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI * 2); ctx.fill(); empty = false; }
  function move(e) { if (!drawing) return; e.preventDefault(); var p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; }
  function end() { drawing = false; }
  c.addEventListener('touchstart', start, { passive: false });
  c.addEventListener('touchmove', move, { passive: false });
  c.addEventListener('touchend', end, false);
  c.addEventListener('mousedown', start, false);
  c.addEventListener('mousemove', move, false);
  window.addEventListener('mouseup', end, false);
  return {
    isEmpty: function () { return empty; },
    clear: function () { ctx.clearRect(0, 0, c.width, c.height); empty = true; },
    data: function () { return c.toDataURL('image/png'); }
  };
}

  h += '<div class="grp">Lizenz</div>';
  if (lic) h += '<p>' + pill('p-ok', 'Vollversion') + ' lizenziert für <b>' + esc(s.lizenzName) + '</b></p>';
  else h += '<p class="small" style="line-height:1.5">' + pill('p-warn', 'Demoversion') + ' 1 Gebäude, PDF mit Wasserzeichen.<br>Lizenz erhältlich bei: ' + esc(FIRMA_KONTAKT) + '</p>' +
    '<label>Lizenznehmer (genau wie auf der Lizenz)</label><input id="s_ln" value="' + esc(s.lizenzName) + '">' +
    '<label>Lizenzcode</label><input id="s_lc" value="' + esc(s.lizenzCode) + '" placeholder="BSB-XXXX-XXXX" autocapitalize="characters">' +
    '<button class="btn pri full" onclick="activateLic()">Freischalten</button>';
  h += '<div class="grp">Allgemein</div><label>Geführt von (Name / Firma, erscheint im Bericht)</label><input id="s_bet" value="' + esc(s.betreiber) + '">' +
    '<button class="btn full" onclick="DB.settings.betreiber=val(\'s_bet\');save(\'settings\');toast(\'Gespeichert\')">Speichern</button>';
  h += '<div class="grp">Gebäude</div>';
  for (var i = 0; i < DB.gebaeude.length; i++) h += '<div class="row" onclick="editGebaeude(\'' + DB.gebaeude[i].id + '\')"><div class="m"><div class="t">' + esc(DB.gebaeude[i].name) + '</div><div class="s">' + esc(DB.gebaeude[i].adresse || '') + '</div></div><span class="small">Bearbeiten</span></div>';
  h += '<button class="btn full" onclick="editGebaeude()">+ Gebäude anlegen</button>';
  h += '<div class="grp">Checklisten für Begehungen</div>';
  for (var j = 0; j < DB.vorlagen.length; j++) h += '<div class="row" onclick="editVorlage(\'' + DB.vorlagen[j].id + '\')"><div class="m"><div class="t">' + esc(DB.vorlagen[j].name) + '</div><div class="s">' + artLabel(DB.vorlagen[j].art) + ' - ' + DB.vorlagen[j].punkte.length + ' Punkte</div></div><span class="small">Bearbeiten</span></div>';
  h += '<div class="btns"><button class="btn sm" onclick="editVorlage()">+ Neue Checkliste</button><button class="btn sm" onclick="resetVorlagen()">Standard-Checklisten hinzufügen</button></div>';
  h += '<div class="grp">Datensicherung</div><p class="small" style="line-height:1.5">Alle Daten sind nur auf diesem Gerät gespeichert. Sichern Sie regelmäßig - z. B. in iCloud Drive oder per Mail. Letzte Sicherung: ' + (s.letztesBackup ? fmtD(s.letztesBackup) : 'noch keine') + '</p>' +
    '<button class="btn pri full" onclick="exportBackup()">Daten sichern (Datei)</button>' +
    '<label>Sicherung wiederherstellen</label><input type="file" accept=".json,application/json" onchange="importBackup(this)">';
  h += '<div class="grp">Info</div><p class="small" style="line-height:1.5">Brandschutzbuch Version ' + APP_VERSION + '<br>' + esc(FIRMA_KONTAKT) + '</p>';
  modal('Einstellungen', h, [{ label: 'Schließen', fn: function () { closeModal(); render(); } }]);
}
function activateLic() {
  var n = val('s_ln'), c = val('s_lc').toUpperCase().replace(/\s/g, '');
  if (!n || !c) { toast('Bitte Name und Code eingeben'); return; }
  if (lizCode(n) !== c) { toast('Lizenzcode passt nicht zum Namen'); return; }
  DB.settings.lizenzName = n; DB.settings.lizenzCode = c; save('settings');
  toast('Vollversion freigeschaltet'); openSettings(); render();
}
function editVorlage(id) {
  var v = id ? findById(DB.vorlagen, id) : null, p = v || { art: 'monatlich', punkte: [] }, o = '';
  for (var i = 0; i < ARTEN.length; i++) o += '<option value="' + ARTEN[i].k + '"' + (ARTEN[i].k === p.art ? ' selected' : '') + '>' + ARTEN[i].l + '</option>';
  var h = '<label>Name der Checkliste</label><input id="v_n" value="' + esc(p.name) + '" placeholder="z. B. Wöchentliche Kontrolle Küche">' +
    '<label>Intervall</label><select id="v_a">' + o + '</select>' +
    '<label>Prüfpunkte (je Zeile ein Punkt)</label><textarea id="v_p" style="min-height:260px">' + esc(p.punkte.join('\n')) + '</textarea>' +
    '<div class="small" style="margin-top:4px">Änderungen gelten für künftige Begehungen. Bestehende Protokolle bleiben unverändert.</div>';
  if (v) h += '<button class="btn full" style="margin-top:18px;color:var(--red2)" onclick="delVorlage(\'' + v.id + '\')">Checkliste löschen</button>';
  modal(v ? 'Checkliste bearbeiten' : 'Neue Checkliste', h, [{ label: 'Zurück', fn: openSettings }, { label: 'Speichern', cls: 'pri', fn: function () {
    var n = val('v_n'), lines = val('v_p').split(/\n/), pts = [];
    for (var k = 0; k < lines.length; k++) { var t = lines[k].replace(/^\s+|\s+$/g, ''); if (t) pts.push(t); }
    if (!n) { toast('Bitte einen Namen angeben'); return; }
    if (!pts.length) { toast('Bitte mindestens einen Prüfpunkt angeben'); return; }
    if (!v) { v = { id: uid() }; DB.vorlagen.push(v); }
    v.name = n; v.art = val('v_a'); v.punkte = pts; save('vorlagen'); toast('Checkliste gespeichert'); openSettings();
  } }]);
}
function delVorlage(id) {
  if (DB.vorlagen.length <= 1) { toast('Mindestens eine Checkliste muss bleiben'); return; }
  ask('Checkliste löschen? Bestehende Protokolle bleiben erhalten.', function () { removeById(DB.vorlagen, id); save('vorlagen'); openSettings(); }, 'Löschen');
}
function resetVorlagen() {
  var d = defVorlagen(), add = 0;
  for (var i = 0; i < d.length; i++) {
    var ex = false;
    for (var j = 0; j < DB.vorlagen.length; j++) if (DB.vorlagen[j].name === d[i].name) ex = true;
    if (!ex) { DB.vorlagen.push(d[i]); add++; }
  }
  save('vorlagen'); toast(add ? add + ' Standard-Checkliste(n) hinzugefügt' : 'Alle Standard-Checklisten sind bereits vorhanden'); openSettings();
}
function exportBackup() {
  var data = { app: 'brandschutzbuch', version: 1, exportiert: new Date().toISOString(), db: DB };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  DB.settings.letztesBackup = todayStr(); save('settings');
  shareBlob(blob, 'Brandschutzbuch-Sicherung_' + todayStr() + '.json', 'application/json');
  render();
}
function importBackup(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var data;
    try { data = JSON.parse(rd.result); } catch (e) { toast('Datei ist keine gültige Sicherung'); return; }
    if (!data || data.app !== 'brandschutzbuch' || !data.db) { toast('Datei ist keine Brandschutzbuch-Sicherung'); return; }
    ask('Alle aktuellen Daten durch die Sicherung vom ' + String(data.exportiert || '').substr(0, 10) + ' ersetzen?', function () {
      for (var i = 0; i < COLLS.length; i++) { var c = COLLS[i]; DB[c] = data.db[c] || (c === 'settings' ? {} : []); save(c); }
      STATE.gid = DB.gebaeude.length ? DB.gebaeude[0].id : null;
      render(); toast('Sicherung wiederhergestellt');
    }, 'Ersetzen');
  };
  rd.readAsText(f);
}

/* ---------- Start ---------- */
function init() {
  dbOpen(function () {
    for (var i = 0; i < COLLS.length; i++) {
      var c = COLLS[i];
      if (c === 'settings') { if (!DB.settings || typeof DB.settings !== 'object' || DB.settings.length !== undefined) DB.settings = {}; }
      else if (!DB[c] || DB[c].length === undefined) DB[c] = [];
    }
    if (!DB.vorlagen.length) { DB.vorlagen = defVorlagen(); save('vorlagen'); }
    var g = null; try { g = localStorage.getItem('bsb_gid'); } catch (e) {}
    STATE.gid = (g && findById(DB.gebaeude, g)) ? g : (DB.gebaeude.length ? DB.gebaeude[0].id : null);
    render();
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js')['catch'](function () {}); } catch (e) {}
  }
}
init();
</script>
</body>
</html>
