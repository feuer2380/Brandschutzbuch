<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brandschutzbuch">
<meta name="theme-color" content="#b91c1c">

<title>Brandschutzbuch</title>
<style>
:root{--red:#b91c1c;--red2:#dc2626;--bg:#f4f4f5;--card:#ffffff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--ok:#15803d;--warn:#b45309;--okbg:#dcfce7;--warnbg:#fef3c7;--errbg:#fee2e2}
@media (prefers-color-scheme: dark){:root{--bg:#09090b;--card:#18181b;--tx:#fafafa;--mut:#a1a1aa;--bd:#2e2e33;--okbg:#14532d;--warnbg:#451a03;--errbg:#450a0a;--ok:#4ade80;--warn:#fbbf24;--red2:#f87171}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px}
header{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--red);color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;align-items:center}
header>*{margin-right:8px}header>*:last-child{margin-right:0}
.brand{font-weight:700;font-size:17px;white-space:nowrap}
#gebSel{flex:1;min-width:0;width:auto;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 8px;font-size:15px}
#gebSel option{color:#000}
.icon{background:none;border:none;color:#fff;padding:6px;display:flex}
.icon svg{width:24px;height:24px}
main{padding:calc(env(safe-area-inset-top) + 66px) 12px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;background:none;border:none;padding:8px 2px 6px;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;position:relative;font-family:inherit}
nav button.on{color:var(--red)}
nav svg{width:24px;height:24px;margin-bottom:2px}
.badge{position:absolute;top:3px;left:56%;background:var(--red2);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px;min-width:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:21px;margin:4px 0 12px}
h3{font-size:13px;margin:0 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;grid-gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:var(--mut)}
.stat.alert b{color:var(--red2)}
.row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.row>*{margin-right:10px}.row>*:last-child{margin-right:0}
.row:last-child{border-bottom:none}
.row .m{flex:1;min-width:0}.row .t{font-weight:600;overflow-wrap:anywhere}.row .s{font-size:13px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:20px;white-space:nowrap;font-weight:700}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-err{background:var(--errbg);color:var(--red2)}.p-mut{background:var(--bd);color:var(--mut)}
.btn{background:var(--bd);color:var(--tx);border:none;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;font-family:inherit}
.btn.pri{background:var(--red);color:#fff}.btn.danger{background:var(--red2);color:#fff}
.btn.full{width:100%;display:block;margin-top:8px}.btn.sm{padding:7px 11px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;margin-top:6px}.btns .btn{margin:4px 6px 0 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-family:inherit;-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
input[type=date],input[type=time]{min-height:44px}
textarea{min-height:80px;resize:vertical}
.two{display:flex}.two>div{flex:1}.two>div:first-child{margin-right:10px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--card);color:var(--tx);padding:10px 4px;font-size:14px;font-weight:600;border-right:1px solid var(--bd);font-family:inherit}
.seg button:last-child{border-right:none}
.seg button.on-ok{background:var(--ok);color:#fff}.seg button.on-err{background:var(--red2);color:#fff}.seg button.on-na{background:var(--mut);color:#fff}.seg button.on{background:var(--red);color:#fff}
.pt{padding:12px 0;border-bottom:1px solid var(--bd)}.pt .q{margin-bottom:8px;font-size:15px}
#modalWrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modalWrap.hidden{display:none}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:94%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);font-weight:700;font-size:17px}
.mhead span{flex:1;margin-right:10px}
.mhead button{background:var(--bd);border:none;border-radius:50%;width:32px;height:32px;font-size:15px;color:var(--tx);flex-shrink:0}
#mBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 18px;flex:1}
#mFoot{display:flex;padding:10px 16px;border-top:1px solid var(--bd)}
#mFoot .btn{flex:1;margin-right:8px}#mFoot .btn:last-child{margin-right:0}
#mFoot.empty{display:none}
.sig{width:100%;height:150px;background:#fff;border:1px dashed var(--mut);border-radius:10px;touch-action:none;display:block}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0}
.foto{width:100%;border-radius:10px;margin-top:8px;display:block}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 78px);background:var(--red);color:#fff;border:none;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:9;font-family:inherit}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:#18181b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;z-index:80;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.kv{width:100%;border-collapse:collapse;font-size:14px}.kv td{padding:7px 0;border-bottom:1px solid var(--bd);vertical-align:top}.kv td:first-child{color:var(--mut);width:42%;padding-right:8px}
.chk{display:flex;align-items:center;padding:9px 0;font-size:15px;margin:0;color:var(--tx);font-weight:400}
.chk input{width:22px;height:22px;margin:0 12px 0 0;flex-shrink:0}
.small{font-size:13px;color:var(--mut)}
.grp{font-size:12px;font-weight:700;color:var(--red);margin:16px 0 0;text-transform:uppercase;letter-spacing:.04em}
.hint{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.lnk{color:var(--red);font-weight:600}
</style>
</head>
<body>
<header>
  <div class="brand">Brandschutzbuch</div>
  <select id="gebSel" onchange="gebSelChange(this)"></select>
  <button class="icon" onclick="openSettings()" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="view"></main>
<nav id="tabs"></nav>
<div id="modalWrap" class="hidden"><div class="modal"><div class="mhead"><span id="mTitle"></span><button onclick="closeModalAsk()" aria-label="Schliessen">&#10005;</button></div><div id="mBody"></div><div id="mFoot"></div></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
/* Brandschutzbuch - lokale Web-App (Janiba Brandschutztechnik GmbH) */
var APP_VERSION = '1.0';
var LIZ_SALT = 'JaNiBa-2380-BSB';
var FIRMA_FOOTER = 'Brandschutzbuch-App | Janiba Brandschutztechnik GmbH | Tel. 0676/305 83 98 | www.brandschutztechnik-janiba.at';
var FIRMA_KONTAKT = 'Janiba Brandschutztechnik GmbH, Ketzergasse 299, 2380 Perchtoldsdorf, Tel. 0676/305 83 98, info@loeschtechnik.at';

var COLLS = ['gebaeude', 'anlagen', 'pruefungen', 'begehungen', 'maengel', 'vorlagen', 'settings'];
var DB = { gebaeude: [], anlagen: [], pruefungen: [], begehungen: [], maengel: [], vorlagen: [], settings: {} };
var idb = null;
var STATE = { tab: 'home', gid: null, anlQ: '', mFilter: 'offen' };
var BEG = null, SIG = null, MFORM = null;

var ARTEN = [
  { k: 'taeglich', l: 'Täglich', d: 1 },
  { k: 'woechentlich', l: 'Wöchentlich', d: 7 },
  { k: 'monatlich', l: 'Monatlich', d: 31 },
  { k: 'vierteljaehrlich', l: 'Vierteljährlich', d: 92 },
  { k: 'halbjaehrlich', l: 'Halbjährlich', d: 183 },
  { k: 'jaehrlich', l: 'Jährlich', d: 366 },
  { k: 'sonstige', l: 'Bei Bedarf', d: 0 }
];
var KATS = [
  { k: 'Feuerlöscher', i: 24 },
  { k: 'Brandschutzklappe', i: 12 },
  { k: 'Brandschutztür / -tor', i: 12 },
  { k: 'Brandmeldeanlage / Melder', i: 12 },
  { k: 'Rauchwarnmelder', i: 12 },
  { k: 'Sicherheitsbeleuchtung', i: 12 },
  { k: 'Wandhydrant / Steigleitung', i: 12 },
  { k: 'Rauch- und Wärmeabzug (RWA)', i: 12 },
  { k: 'Sprinkleranlage', i: 12 },
  { k: 'Löschdecke', i: 24 },
  { k: 'Fluchtweg / Notausgang', i: 12 },
  { k: 'Flucht- und Rettungsplan', i: 12 },
  { k: 'Sonstiges', i: 12 }
];
var PRIOS = [{ k: 'hoch', l: 'Hoch', c: '#dc2626' }, { k: 'mittel', l: 'Mittel', c: '#f59e0b' }, { k: 'gering', l: 'Gering', c: '#16a34a' }];

var VORLAGEN_VER = 4;
/* Zeilen mit # am Anfang sind Abschnitts-Überschriften (z. B. Pos. 1) */
function jahresBegehung() {
  return { id: uid(), name: 'Jährliche Begehung', art: 'jaehrlich', punkte: [
    '# Pos. 1 – Feuerwehrzufahrt und -aufstellfläche',
    'Sind Zufahrten, Bewegungs- und Aufstellflächen dauerhaft freigehalten (nicht verstellt)?',
    'Sind Bodenmarkierungen gut sichtbar und unbeschädigt?',
    'Werden Halte- und Parkverbote konsequent eingehalten?',
    'Ist die Sperrbarkeit / Freischaltung von Schranken, Pollern u. Ä. gegeben?',
    'Sind Beschilderungen („Feuerwehrzufahrt“, „Anleitbereich“) vorhanden und gut lesbar?',
    'Ist die Zugänglichkeit zu Schlüsseltresor / Feuerwehr-Schlüsselsafe (FWS) gewährleistet?',
    'Wird die Schneeräumung / Streuung bei Bedarf ordnungsgemäß durchgeführt?',
    '# Pos. 2 – Löschwasserversorgung',
    'Sind Über- und Unterflurhydranten jederzeit frei zugänglich und hindernisfrei?',
    'Wurde die jährliche Funktionsprüfung/Wartung durchgeführt und dokumentiert?',
    'Sind Unterflurhydranten durch Hinweisschilder ordnungsgemäß gekennzeichnet?',
    'Sind die Hydranten im Brandschutzplan korrekt eingezeichnet?',
    'Sind Gehäuse, Anschlüsse und Spindeln beschädigungsfrei und betriebsbereit?',
    '# Pos. 3 – Löschwasserentnahmestellen (Bach, Brunnen, Teiche usw.)',
    'Ist die freie Zufahrt für Feuerwehrfahrzeuge ungehindert möglich?',
    'Ist die Benutzbarkeit auch im Winter (Eisfreihaltung/Schneeräumung) gewährleistet?',
    'Ist die Zusatzausrüstung (Saugleitung, FW-Schloss, Beschilderung) vollständig u. in Ordnung?',
    'Ist die Entnahmestelle frei von Bewuchs, Anschwemmungen oder Verunreinigungen?',
    '# Pos. 4 – Löschwasserrückhaltung',
    'Ist der Bescheid erfüllt?',
    'Ist die Funktionsfähigkeit und Dichtheit gegeben?',
    '# Pos. 5 – Löschmittel- und Sonderlöschmittelbevorratung',
    'Ist das Löschmittel innerhalb des Ablaufdatums (nicht abgelaufen)?',
    'Ist der Bescheid erfüllt?',
    '# Pos. 6 – Brandabschnitte (Wände, Decken etc.)',
    'Ist die Brandwand im Dachbereich normgerecht und unbeschädigt ausgeführt?',
    'Sind Brandabschnittswände und -decken frei von sichtbaren Beschädigungen und Rissen?',
    'Sind alle Leitungs- und Rohrdurchführungen ordnungsgemäß verschottet?',
    'Sind nachträglich eingebaute Leitungen/Kabel vollkommen verschlossen?',
    'Sind Lüftungsleitungen im Wand-/Deckendurchtritt regelkonform mit Klappen versehen?',
    'Sind Brandschutzanstriche/-beschichtungen unbeschädigt und vollständig?',
    '# Pos. 7 – Brandschutzklappen',
    'Sind die Klappen direkt und fachgerecht an die Wand/Decke angeschlossen?',
    'Sind freie Strecken ordnungsgemäß mit Brandschutzplatten verkleidet?',
    'Wurde die jährliche Wartung/Überprüfung durchgeführt und dokumentiert?',
    'Sind Auslösemechanismen und Rückstellhebel frei zugänglich?',
    'Sind Brandschutzklappen und Kanäle frei von übermäßigen Verschmutzungen?',
    '# Pos. 8 – Lüftungsleitungen',
    'Sind die Leitungen frei von gefahrenträchtigen Ablagerungen brennbarer Stoffe?',
    'Ist eine ausreichende Anzahl an Revisions-/Reinigungsöffnungen vorhanden?',
    'Werden Reinigungsprogramme ordnungsgemäß durchgeführt und dokumentiert?',
    '# Pos. 9 – Abschottungen',
    'Ist der Brandschutzanstrich am und um das Schott vollständig vorhanden?',
    'Sind alle Abschottungen vollständig verschlossen und ohne Beschädigungen?',
    'Sind alle Abschottungen richtlinienkonform gekennzeichnet (Schott-Schilder)?',
    '# Pos. 10 – Brandschutzpläne',
    'Sind Brandschutzpläne sowie Flucht- und Rettungspläne aktuell und korrekt?',
    '# Pos. 11 – Brandschutzordnung',
    'Ist die Brandschutzordnung auf dem aktuellen Stand?',
    'Wurde sie allen Mitarbeitern (inkl. Neueingetretenen) nachweislich übergeben?',
    'Wurde die Brandschutzordnung auch Fremdfirmen nachweislich zur Kenntnis gebracht?',
    'Stehen die Brandschutzunterlagen auch bei der Hausverwaltung / Eigentümer zur Verfügung?',
    '# Pos. 12 – Alarmordnung',
    'Sind die Alarmordnungen an allen geforderten Plätzen gut sichtbar ausgehängt?',
    'Ist die Alarmordnung Bestandteil der aktuellen Brandschutzordnung?',
    '# Pos. 13 – Interne Alarmanlage',
    'Ist die interne Alarmanlage notstromversorgt und betriebsbereit?',
    'Wurde die gesamte Anlage fristgerecht (mind. alle 2 Jahre) einer Inspektion unterzogen?',
    'Ist das Alarmsignal in allen Gebäudebereichen deutlich hörbar?',
    'Sind erforderliche optische Signalgeber (z. B. bei Lärmbereichen) vorhanden u. funktionstüchtig?',
    'Sind alle Mitarbeiter mit den Alarmsignalen und Abläufen vertraut?',
    'Sind Druckknopfmelder für internen Alarm (blau) unbeschädigt und frei zugänglich?',
    'Sind Sammelplätze festgelegt, gekennzeichnet und ungehindert erreichbar?',
    'Werden regelmäßige Eigenkontrollen gemäß Hersteller- und Normvorgaben durchgeführt?',
    '# Pos. 14 – Blitzschutz',
    'Ist die Blitzschutzanlage frei von sichtbaren Mängeln und Beschädigungen?',
    'Liegt ein aktuelles, mängelfreies Prüfattest nach ÖVE/ÖNORM-Richtlinien vor?',
    'Erfolgen Prüfungen und Wartungen nach außergewöhnlichen Ereignissen (z. B. Blitzeinschlag)?',
    '# Pos. 15 – Explosionsgeschützte Elektroinstallationen',
    'Liegen für ex-geschützte Bereiche/Anlagen gültige Explosionsschutzdokumente u. E-Atteste vor?',
    '# Pos. 16 – Hauptabsperreinrichtungen Gas',
    'Sind Rohrleitungen und Fließrichtungen ordnungsgemäß gekennzeichnet?',
    'Sind wichtige Schieber/Ventile im Brandschutzplan eingezeichnet und gekennzeichnet?',
    'Sind Gas-Hauptabsperreinrichtungen frei von Verstellungen und jederzeit zugänglich?',
    '# Pos. 17 – Hauptabsperreinrichtungen Wasser',
    'Sind Rohrleitungen und Fließrichtungen ordnungsgemäß gekennzeichnet?',
    'Sind wichtige Schieber/Ventile im Brandschutzplan eingezeichnet und gekennzeichnet?',
    'Sind Wasser-Hauptabsperreinrichtungen frei von Verstellungen und jederzeit zugänglich?',
    '# Pos. 18 – Hauptabsperreinrichtungen Heizung',
    'Sind Rohrleitungen und Fließrichtungen ordnungsgemäß gekennzeichnet?',
    'Sind wichtige Schieber/Ventile im Brandschutzplan eingezeichnet u. gekennzeichnet?',
    'Sind Absperreinrichtungen der Heizungsanlage frei von Verstellungen u. jederzeit zugänglich?',
    '# Pos. 19 – Wartungen',
    'Liegen aktuelle Wartungspläne und Intervalle für alle Brandschutzeinrichtungen vor?',
    'Werden alle geforderten Wartungen fristgerecht durchgeführt u. dokumentiert?',
    'Wird im Budget Vorsorge für Wartungen im Bereich Brandschutz getroffen?',
    '# Pos. 20 – Schlüsselsysteme Allgemeinbereich',
    'Sind alle Allgemein- und Betriebsräume mit dem vorgesehenen Schließsystem sperrbar?',
    '# Pos. 21 – Heißarbeiten',
    'Sind betriebstechnische Abläufe für Heißarbeiten im Unternehmen verbindlich geregelt?',
    'Sind Personen für die Freigabe von Heißarbeiten nachweislich geschult/beauftragt?',
    'Werden Heißarbeiten konsequent mit Freigabeschein (gemäß TRVB 104) freigegeben?',
    'Ist die Instandhaltung/Haustechnik vor Beginn der Arbeiten eingebunden?',
    'Werden kaltverarbeitende Alternativmethoden vorrangig geprüft und eingesetzt?',
    'Sind Brandwachen während und Nachkontrollen nach den Arbeiten sichergestellt?',
    'Werden Heißarbeitsgeräte (Schweißgeräte etc.) regelmäßig geprüft u. in Ordnung gehalten?',
    '# Pos. 22 – Feuerstätten',
    'Wird die Kehrung und Abgasmessung durch den Rauchfangkehrer regelmäßig durchgeführt?',
    'Wird das Kehrbuch lückenlos geführt und aufbewahrt?',
    'Sind die Sicherheitsabstände um Feuerstätten frei von brennbaren Lagerungen?',
    'Ist die Rückbrandsicherung (RBS) bei Pellets-/Hackschnitzelheizungen in Ordnung?',
    'Ist der Heizraum frei von unzulässigen brennbaren Lagerungen?',
    'Ist eine ausreichende Verbrennungsluftzufuhr/Lüftung für den Heizraum vorhanden?',
    'Wurde die Dichtheitsprüfung der Brennstoffleitungen ordnungsgemäß durchgeführt?',
    'Ist der Heizungs-Notschalter gut sichtbar gekennzeichnet, frei zugänglich u. funktionstüchtig?',
    '# Pos. 23 – Öltankraum',
    'Wurde die vorgeschriebene Sicherheitsüberprüfung/Wartung durchgeführt u. dokumentiert?',

/* ---------- Speicher (IndexedDB, Fallback localStorage) ---------- */
function loadLS() {
  for (var i = 0; i < COLLS.length; i++) {
    try { var v = localStorage.getItem('bsb_' + COLLS[i]); if (v) DB[COLLS[i]] = JSON.parse(v); } catch (e) {}
  }
}
function dbOpen(cb) {
  var done = false;
  function fin() { if (done) return; done = true; cb(); }
  if (!window.indexedDB) { loadLS(); fin(); return; }
  var req;
  try { req = indexedDB.open('brandschutzbuch', 1); } catch (e) { loadLS(); fin(); return; }
  req.onupgradeneeded = function (e) { var db = e.target.result; if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'k' }); };
  req.onsuccess = function (e) {
    idb = e.target.result;
    try {
      var tx = idb.transaction('kv', 'readonly');
      var r = tx.objectStore('kv').openCursor();
      r.onsuccess = function (ev) { var c = ev.target.result; if (c) { DB[c.value.k] = c.value.v; c['continue'](); } else { fin(); } };
      r.onerror = function () { fin(); };
    } catch (er) { fin(); }
  };
  req.onerror = function () { idb = null; loadLS(); fin(); };
}
function save(coll) {
  if (idb) {
    try {
      var tx = idb.transaction('kv', 'readwrite');
      tx.objectStore('kv').put({ k: coll, v: DB[coll] });
      tx.onerror = function () { toast('Speichern fehlgeschlagen - Speicher voll?'); };
      return;
    } catch (e) {}
  }
  try { localStorage.setItem('bsb_' + coll, JSON.stringify(DB[coll])); } catch (e2) { toast('Speicher voll - bitte Fotos reduzieren'); }
}

function lizCode(name) { var h = fnv(normName(name) + '|' + LIZ_SALT); var x = ('00000000' + h.toString(16).toUpperCase()).slice(-8); return 'BSB-' + x.substr(0, 4) + '-' + x.substr(4, 4); }

  for (var i = 0; i < l.length; i++) { var d = daysUntil(l[i].naechstePruefung); if (d !== null && d <= tage) r.push(l[i]); }

}
function anlName(a) { if (!a) return ''; return (a.bezeichnung || a.kategorie) + (a.nr ? ' Nr. ' + a.nr : ''); }

  if (d < 0) return pill('p-err', 'überfällig');

}
function anlStatusText(a) {

function lastBeg(vid) {

    var S = secs[s]; if (!S.q.length) continue;
    need(Math.min(S.q.length, 3) * 9 + 16);
    if (S.t) { doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(0, 0, 0); doc.text(S.t, ML, y + 2); y += 4; }
    var body = [];
    for (var k = 0; k < S.q.length; k++) body.push([S.q[k], '', '', '', '']);
    doc.autoTable({
      startY: y, head: [['Frage', 'Ja', 'Nein', 'Datum', 'Bemerkung']], body: body, theme: 'grid',
      margin: { left: ML, right: MR, top: 18, bottom: 22 },
      styles: { font: 'helvetica', fontSize: 9, cellPadding: 1.6, minCellHeight: 8, valign: 'middle', lineColor: [0, 0, 0], lineWidth: 0.2, textColor: [0, 0, 0] },
      headStyles: { fillColor: [242, 242, 242], textColor: [0, 0, 0], fontStyle: 'bold', minCellHeight: 6 },
      columnStyles: { 0: { cellWidth: 'auto' }, 1: { cellWidth: 11, halign: 'center' }, 2: { cellWidth: 11, halign: 'center' }, 3: { cellWidth: 22 }, 4: { cellWidth: 38 } },
      didDrawCell: function (d) {
        if (d.section !== 'body' || (d.column.index !== 1 && d.column.index !== 2)) return;
        var b = 3.2; doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.25);
        doc.rect(d.cell.x + (d.cell.width - b) / 2, d.cell.y + (d.cell.height - b) / 2, b, b);
      }
    });
    y = doc.lastAutoTable.finalY + 8;
  }
  need(28); y += 8;
  doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.2);
  doc.line(ML, y, ML + 55, y); doc.line(ML + 65, y, ML + 105, y); doc.line(ML + 115, y, W - MR, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(80, 80, 80);
  doc.text('Name', ML, y + 4); doc.text('Datum', ML + 65, y + 4); doc.text('Unterschrift', ML + 115, y + 4);

  var np = doc.getNumberOfPages(), lbl = artLabel(v.art), demo = !isLicensed();
  for (var pg = 1; pg <= np; pg++) {
    doc.setPage(pg);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(30); doc.setTextColor(ORANGE[0], ORANGE[1], ORANGE[2]);
    doc.text(lbl, W - 8, 14, { angle: -90 });
    doc.setFontSize(8.5); doc.setTextColor(0, 0, 0);
    doc.text('Janiba Brandschutztechnik', ML, H - 10);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10);
    doc.text('Brandschutzbuch', W / 2, H - 10, { align: 'center' });
    doc.text('Seite ' + pg + ' von ' + np, W - MR, H - 10, { align: 'right' });
    if (demo) demoMark(doc);
  }
  pdfReady(doc, 'Vorlage_' + safeName(v.name) + '.pdf');
}
function shareBlob(blob, fname, mime) {
  var file = null;
  try { file = new File([blob], fname, { type: mime }); } catch (e) { file = null; }
  if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: fname })['catch'](function (err) { if (err && err.name !== 'AbortError') downloadBlob(blob, fname); });
    return;
  }
  downloadBlob(blob, fname);
}
function downloadBlob(blob, fname) {
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = fname; document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 5000);
}
function pdfReady(doc, fname) {
  var blob = doc.output('blob');
  var kb = Math.round(blob.size / 1024);
  modal('PDF ist fertig', '<p style="line-height:1.5">' + esc(fname) + '<br><span class="small">' + doc.getNumberOfPages() + ' Seite(n), ' + (kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : kb + ' KB') + '</span></p><p class="small">Über "Teilen / Sichern" können Sie das PDF per Mail senden, in Dateien sichern oder drucken.</p>',
    [{ label: 'Schließen', fn: closeModal }, { label: 'Teilen / Sichern', cls: 'pri', fn: function () { shareBlob(blob, fname, 'application/pdf'); } }]);
}

/* ---------- Einstellungen ---------- */
function openSettings() {
  var s = DB.settings, lic = isLicensed(), h = '';
  h += '<div class="grp">Lizenz</div>';
  if (lic) h += '<p>' + pill('p-ok', 'Vollversion') + ' lizenziert für <b>' + esc(s.lizenzName) + '</b></p>';
  else h += '<p class="small" style="line-height:1.5">' + pill('p-warn', 'Demoversion') + ' 1 Gebäude, PDF mit Wasserzeichen.<br>Lizenz erhältlich bei: ' + esc(FIRMA_KONTAKT) + '</p>' +
    '<label>Lizenznehmer (genau wie auf der Lizenz)</label><input id="s_ln" value="' + esc(s.lizenzName) + '">' +
    '<label>Lizenzcode</label><input id="s_lc" value="' + esc(s.lizenzCode) + '" placeholder="BSB-XXXX-XXXX" autocapitalize="characters">' +
    '<button class="btn pri full" onclick="activateLic()">Freischalten</button>';
  h += '<div class="grp">Allgemein</div><label>Geführt von (Name / Firma, erscheint im Bericht)</label><input id="s_bet" value="' + esc(s.betreiber) + '">' +
    '<button class="btn full" onclick="DB.settings.betreiber=val(\'s_bet\');save(\'settings\');toast(\'Gespeichert\')">Speichern</button>';
  h += '<div class="grp">Gebäude</div>';
  for (var i = 0; i < DB.gebaeude.length; i++) h += '<div class="row" onclick="editGebaeude(\'' + DB.gebaeude[i].id + '\')"><div class="m"><div class="t">' + esc(DB.gebaeude[i].name) + '</div><div class="s">' + esc(DB.gebaeude[i].adresse || '') + '</div></div><span class="small">Bearbeiten</span></div>';
  h += '<button class="btn full" onclick="editGebaeude()">+ Gebäude anlegen</button>';
  h += '<div class="grp">Checklisten für Begehungen</div>';
  for (var j = 0; j < DB.vorlagen.length; j++) h += '<div class="row" onclick="editVorlage(\'' + DB.vorlagen[j].id + '\')"><div class="m"><div class="t">' + esc(DB.vorlagen[j].name) + '</div><div class="s">' + artLabel(DB.vorlagen[j].art) + ' - ' + nFragen(DB.vorlagen[j]) + ' Fragen</div></div><span class="small">Bearbeiten</span></div>';
  h += '<div class="btns"><button class="btn sm" onclick="editVorlage()">+ Neue Checkliste</button><button class="btn sm" onclick="resetVorlagen()">Standard-Checklisten hinzufügen</button></div>';
  h += '<div class="grp">Datensicherung</div><p class="small" style="line-height:1.5">Alle Daten sind nur auf diesem Gerät gespeichert. Sichern Sie regelmäßig - z. B. in iCloud Drive oder per Mail. Letzte Sicherung: ' + (s.letztesBackup ? fmtD(s.letztesBackup) : 'noch keine') + '</p>' +
    '<button class="btn pri full" onclick="exportBackup()">Daten sichern (Datei)</button>' +
    '<label>Sicherung wiederherstellen</label><input type="file" accept=".json,application/json" onchange="importBackup(this)">';
  h += '<div class="grp">Info</div><p class="small" style="line-height:1.5">Brandschutzbuch Version ' + APP_VERSION + '<br>' + esc(FIRMA_KONTAKT) + '</p>';
  modal('Einstellungen', h, [{ label: 'Schließen', fn: function () { closeModal(); render(); } }]);
}
function activateLic() {
  var n = val('s_ln'), c = val('s_lc').toUpperCase().replace(/\s/g, '');
  if (!n || !c) { toast('Bitte Name und Code eingeben'); return; }
  if (lizCode(n) !== c) { toast('Lizenzcode passt nicht zum Namen'); return; }
  DB.settings.lizenzName = n; DB.settings.lizenzCode = c; save('settings');
  toast('Vollversion freigeschaltet'); openSettings(); render();
}
function editVorlage(id) {
  var v = id ? findById(DB.vorlagen, id) : null, p = v || { art: 'monatlich', punkte: [] }, o = '';
  for (var i = 0; i < ARTEN.length; i++) o += '<option value="' + ARTEN[i].k + '"' + (ARTEN[i].k === p.art ? ' selected' : '') + '>' + ARTEN[i].l + '</option>';
  var h = '<label>Name der Checkliste</label><input id="v_n" value="' + esc(p.name) + '" placeholder="z. B. Wöchentliche Kontrolle Küche">' +
    '<label>Intervall</label><select id="v_a">' + o + '</select>' +
    '<label>Fragen (je Zeile eine Frage)</label><textarea id="v_p" style="min-height:300px">' + esc(p.punkte.join('\n')) + '</textarea>' +
    '<div class="small" style="margin-top:4px;line-height:1.45">Zeilen mit <b>#</b> am Anfang sind Überschriften, z. B. <i># Pos. 1 – Feuerwehrzufahrt</i>. Fragen so formulieren, dass <b>Ja = in Ordnung</b> bedeutet.</div>' +
    '<div class="small" style="margin-top:4px">Änderungen gelten für künftige Begehungen. Bestehende Protokolle bleiben unverändert.</div>';
  if (v) h += '<button class="btn full" style="margin-top:18px" onclick="vorlagePdf(\'' + v.id + '\')">Leere Vorlage drucken (PDF)</button><button class="btn full" style="color:var(--red2)" onclick="delVorlage(\'' + v.id + '\')">Checkliste löschen</button>';
  modal(v ? 'Checkliste bearbeiten' : 'Neue Checkliste', h, [{ label: 'Zurück', fn: openSettings }, { label: 'Speichern', cls: 'pri', fn: function () {
    var n = val('v_n'), lines = val('v_p').split(/\n/), pts = [];
    for (var k = 0; k < lines.length; k++) { var t = lines[k].replace(/^\s+|\s+$/g, ''); if (t) pts.push(t); }
    if (!n) { toast('Bitte einen Namen angeben'); return; }
    if (!nFragen({ punkte: pts })) { toast('Bitte mindestens eine Frage angeben'); return; }
    if (!v) { v = { id: uid() }; DB.vorlagen.push(v); }
    v.name = n; v.art = val('v_a'); v.punkte = pts; v.geaendert = true; save('vorlagen'); toast('Checkliste gespeichert'); openSettings();
  } }]);
}
function delVorlage(id) {
  if (DB.vorlagen.length <= 1) { toast('Mindestens eine Checkliste muss bleiben'); return; }
  ask('Checkliste löschen? Bestehende Protokolle bleiben erhalten.', function () { removeById(DB.vorlagen, id); save('vorlagen'); openSettings(); }, 'Löschen');
}
function resetVorlagen() {
  var d = defVorlagen(), add = 0;
  for (var i = 0; i < d.length; i++) {
    var ex = false;
    for (var j = 0; j < DB.vorlagen.length; j++) if (DB.vorlagen[j].name === d[i].name) ex = true;
    if (!ex) { DB.vorlagen.push(d[i]); add++; }
  }
  save('vorlagen'); toast(add ? add + ' Standard-Checkliste(n) hinzugefügt' : 'Alle Standard-Checklisten sind bereits vorhanden'); openSettings();
}
function exportBackup() {
  var data = { app: 'brandschutzbuch', version: 1, exportiert: new Date().toISOString(), db: DB };
  var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  DB.settings.letztesBackup = todayStr(); save('settings');
  shareBlob(blob, 'Brandschutzbuch-Sicherung_' + todayStr() + '.json', 'application/json');
  render();
}
function importBackup(input) {
  var f = input.files && input.files[0]; if (!f) return;
  var rd = new FileReader();
  rd.onload = function () {
    var data;
    try { data = JSON.parse(rd.result); } catch (e) { toast('Datei ist keine gültige Sicherung'); return; }
    if (!data || data.app !== 'brandschutzbuch' || !data.db) { toast('Datei ist keine Brandschutzbuch-Sicherung'); return; }
    ask('Alle aktuellen Daten durch die Sicherung vom ' + String(data.exportiert || '').substr(0, 10) + ' ersetzen?', function () {
      for (var i = 0; i < COLLS.length; i++) { var c = COLLS[i]; DB[c] = data.db[c] || (c === 'settings' ? {} : []); save(c); }
      STATE.gid = DB.gebaeude.length ? DB.gebaeude[0].id : null;
      render(); toast('Sicherung wiederhergestellt');
    }, 'Ersetzen');
  };
  rd.readAsText(f);
}

/* ---------- Start ---------- */
function init() {
  dbOpen(function () {
    for (var i = 0; i < COLLS.length; i++) {
      var c = COLLS[i];
      if (c === 'settings') { if (!DB.settings || typeof DB.settings !== 'object' || DB.settings.length !== undefined) DB.settings = {}; }
      else if (!DB[c] || DB[c].length === undefined) DB[c] = [];
    }
    if (!DB.vorlagen.length) { DB.vorlagen = defVorlagen(); DB.settings.vorlagenVer = VORLAGEN_VER; save('vorlagen'); save('settings'); }
    if ((DB.settings.vorlagenVer || 1) < VORLAGEN_VER) {
      var std = [monatsBegehung(), quartalBegehung(), jahresBegehung()];
      for (var sv = 0; sv < std.length; sv++) {
        var ex = null;
        for (var vv = 0; vv < DB.vorlagen.length; vv++) if (DB.vorlagen[vv].name === std[sv].name) ex = DB.vorlagen[vv];
        if (!ex) DB.vorlagen.push(std[sv]); else if (!ex.geaendert) ex.punkte = std[sv].punkte;
      }
      DB.settings.vorlagenVer = VORLAGEN_VER; save('vorlagen'); save('settings');
    }
    var g = null; try { g = localStorage.getItem('bsb_gid'); } catch (e) {}
    STATE.gid = (g && findById(DB.gebaeude, g)) ? g : (DB.gebaeude.length ? DB.gebaeude[0].id : null);
    render();
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js')['catch'](function () {}); } catch (e) {}
  }
}
init();
</script>
